<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유튜브 영상 카드</title>
  <link rel="stylesheet" href="./css/05_youtube.css">
</head>
<body>
  <div class="container">
    <div class="thumbnail">
      <div class="time">12:34</div>
    </div>

    <div class="content">
      <h2 class="title">리액트 30분 만에 끝내기 입문자용</h2>

      <p class="meta">조회수 1.2만 · 3일 전</p>

      <p class="description">
        리액트의 기초를 배우는 입문자용 무료 강의 영상입니다.
      </p>

      <div class="channel">
        <img class="profile" src="./image/channel.jpg" alt="채널 프로필" />
        <div class="channel-name">코딩하는 미니</div>
      </div>

      <div class="footer">
        <span>👍 320</span>
        <span>💬 45</span>
      </div>
    </div>
  </div>
</body>
</html>
