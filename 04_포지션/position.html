<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            position: relative;
            width: 200px;
            border: 1px solid gray;
        }
        .badge {
            position: absolute;
            right: 10px;
            top: 10px;
            background-color: tomato;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
        }
        .card img {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="./image/product1-1.jpg" alt="상품">
        <p>상품이름</p>
        <span class="badge">NEW</span>
    </div>
</body>
</html>
